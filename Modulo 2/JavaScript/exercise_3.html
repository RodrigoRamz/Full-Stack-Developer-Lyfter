<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Exercise 3</title>
</head>
<body>
    <h1>Employee Form</h1>

    <form>
        <label for="email">Email:</label>
        <input type="email" id="email">

        <label for="password">Password:</label>
        <input type="password" id="password">

        <label for="first-name">First Name:</label>
        <input type="text" id="first-name">

        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name">

        <p>Are you an employee?</p>

        <label>
            <input type="radio" name="employee" value="yes">
            Yes
        </label>

        <label>
            <input type="radio" name="employee" value="no" checked>
            No
        </label>

        <div id="employment-field" hidden>
            <label for="employment">Employment:</label>
            <input type="text" id="employment">
        </div>
    </form>

    <script>
        const employeeOptions = document.querySelectorAll('input[name="employee"]');
        const employmentField = document.getElementById("employment-field");

        employeeOptions.forEach(function(option) {
            option.addEventListener("change", function() {
                employmentField.hidden = option.value !== "yes";
            });
        });
    </script>
</body>
</html>
