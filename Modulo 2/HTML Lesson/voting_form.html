<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Formulario de votación</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Formulario de votación</h1>
    <form action="https://dummyjson.com/test" method="POST">
      <label for="full_name">Nombre completo</label>
      <br />
      <input type="text" id="full_name" name="fullName" />
      <br />
      <label for="email">Correo</label>
      <br />
      <input type="email" id="email" name="email" />
      <br />
      <label for="identification">Núm. de identificación</label>
      <br />
      <input type="text" id="identification" name="identification" />
      <br />
      <label for="phone">Teléfono</label>
      <br />
      <input type="tel" id="phone" name="phone" />
      <br />
      <h2>Seleccione un candidato</h2>
      <input type="radio" id="candidate_1" name="candidate" value="candidate_1" />
      <label for="candidate_1">Candidato #1</label>
      <br />
      <input type="radio" id="candidate_2" name="candidate" value="candidate_2" />
      <label for="candidate_2">Candidato #2</label>
      <br />
      <input type="radio" id="candidate_3" name="candidate" value="candidate_3" />
      <label for="candidate_3">Candidato #3</label>
      <br />
      <input type="submit" value="Confirmar voto" />            
    </form> 
  </body>
</html>
