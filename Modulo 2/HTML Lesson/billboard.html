<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Billboard Hot 100</title>
    <link rel="stylesheet" href="billboard_styles.css" />
  </head>

  <body>
    <h1>Billboard Hot 100</h1>

    <table>
      <thead>
        <tr>
        <th>Rank</th>
        <th>Song</th>
        <th>Artist</th>
        <th>Last Week</th>
        <th>Peak</th>
        <th>Weeks</th>
        </tr>
    </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Example Song</td>
          <td>Example Artist</td>
          <td>2</td>
          <td>1</td>
          <td>10</td>
        </tr>

        <tr>
          <td>2</td>
          <td>Second Song</td>
          <td>Second Artist</td>
          <td>1</td>
          <td>1</td>
          <td>8</td>
        </tr>

        <tr>
          <td>3</td>
          <td>Another Song</td>
          <td>Another Artist</td>
          <td>5</td>
          <td>3</td>
          <td>6</td>
        </tr>

        <tr>
          <td>4</td>
          <td>New Song</td>
          <td>New Artist</td>
          <td>7</td>
          <td>4</td>
          <td>4</td>
        </tr>

        <tr>
          <td>5</td>
          <td>Final Song</td>
          <td>Final Artist</td>
          <td>3</td>
          <td>2</td>
          <td>12</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
